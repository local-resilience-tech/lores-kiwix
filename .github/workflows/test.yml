name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libkiwix-dev protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run integration tests
        run: |
          cargo test --manifest-path crates/lores-kiwix/Cargo.toml \
            --test local_registration \
            --test local_deregistration \
            --test remote_registration \
            --test remote_deregistration \
            --test api \
            --test static
