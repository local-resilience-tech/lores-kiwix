[package]
name = "lores-kiwix"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
axum-reverse-proxy = { version = "1.3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
elementtree = "1.2"
libkiwix-rust = { path = "../libkiwix-rust" }
lores-kiwix-node = { path = "../lores-kiwix-node" }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
sqlx = { workspace = true, features = ["derive"] }
url = "2"
tokio = { workspace = true, features = ["full"] }
tracing = "0.1"