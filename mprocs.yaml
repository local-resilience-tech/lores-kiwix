# Run the multi-instance dev stack with `just dev`.
#
# mprocs 0.9 doesn't substitute {{...}} templates, so each command is a shell
# string that reads the environment variables exported by `justfile`. We build
# first and then `exec` the binary so mprocs signals reach the application
# directly (`cargo run` does not reliably forward signals to its child binary).
procs:
  panda-dev-server:
    cwd: <CONFIG_DIR>
    shell: "cargo build -p lores-kiwix-dev-server && exec ./target/debug/lores-kiwix-dev-server"
  kiwix-a:
    cwd: <CONFIG_DIR>
    shell: >-
      cargo build -p lores-kiwix &&
      exec env PANDA_GRPC_ADDR="$PANDA_GRPC_ADDR"
      LORES_INSTANCE_ID=instance-a
      DATA_DIR=./.dev/data-a
      KIWIX_INTERNAL_BIND=127.0.0.1:18080
      ./target/debug/lores-kiwix ./.dev/data-a/zims "127.0.0.1:$BASE_PORT"
  kiwix-b:
    cwd: <CONFIG_DIR>
    shell: >-
      cargo build -p lores-kiwix &&
      exec env PANDA_GRPC_ADDR="$PANDA_GRPC_ADDR"
      LORES_INSTANCE_ID=instance-b
      DATA_DIR=./.dev/data-b
      KIWIX_INTERNAL_BIND=127.0.0.1:18081
      ./target/debug/lores-kiwix ./.dev/data-b/zims "127.0.0.1:$BASE_PORT_2"
    autostart: false

keymap:
  quit: q
